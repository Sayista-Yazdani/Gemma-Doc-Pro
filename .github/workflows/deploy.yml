# Premium CI/CD Pipeline for Gemma Doc Pro
# Automates code quality verification (Linting, TypeScript compilation)
# and performs automated serverless deployment to GitHub Pages.

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------
  # Job 1: Build & Verify (Runs on PRs and Branch Pushes)
  # ----------------------------------------------------
  verify:
    name: Lint & Compile Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Code Linter
        run: npm run lint

      - name: Compile TypeScript & Build Production Assets
        run: npm run build

      - name: Upload Build Artifact for Deployment
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # ----------------------------------------------------
  # Job 2: Secure Production Deployment (Runs only on main/master merge)
  # ----------------------------------------------------
  deploy:
    name: Production Deployment to Live
    needs: verify
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
